[project]
name = "field-station"
version = "0.1.0"
description = "Processes outside-world sensor data (ADS-B and AIS contacts first) and publishes it for others to consume"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["aiohttp"]

[project.scripts]
field-station = "field_station.app:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
